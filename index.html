<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#2676dc"><meta name="apple-mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-status-bar-style" content="default"><meta name="apple-mobile-web-app-title" content="Blue's Clues"><link rel="manifest" href="./manifest.webmanifest"><link rel="icon" href="./icon.svg" type="image/svg+xml"><title>Blue's Clues at Home</title><style>
:root{font-family:system-ui,-apple-system,sans-serif;color:#16304e;background:#f4f9ff}*{box-sizing:border-box}body{margin:0}main{max-width:520px;margin:auto;padding:24px 16px 40px}.card{background:white;border-radius:24px;padding:22px;box-shadow:0 5px 28px #16447b16}.top{display:flex;justify-content:space-between;align-items:center;color:#61758e;font-size:13px;font-weight:700}.pill{border-radius:20px;padding:7px 12px;background:#fff1cf;color:#76500d}.play{background:#d8f8e3;color:#126236}.question{text-align:center;background:#eaf4ff;border-radius:18px;padding:22px 12px;margin:20px 0}.paw{font-size:40px;color:#2676dc}.question h1{font-size:23px;margin:8px 0}.clue{display:flex;gap:16px;align-items:center;padding:17px;background:#f3f8fd;border-radius:14px;margin:10px 0;font-weight:650}.clue .paw{font-size:26px}button{font:inherit;cursor:pointer;border:0;border-radius:14px;padding:14px 17px;font-weight:750;background:#2676dc;color:white}button:disabled{opacity:.35}button.secondary{background:#edf3fa;color:#204d7d}button.ghost{background:transparent;color:#315c8e}.wide{width:100%;margin-top:12px}.clues{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:9px}.tile{min-height:118px;background:#eef6ff;color:#16477f;padding:10px 6px;font-size:14px;overflow-wrap:anywhere}.tile.found{background:#dff4e7;color:#135e36}.tile .paw{display:block;font-size:32px;margin-bottom:8px}.nav{display:flex;justify-content:space-between;gap:10px;margin-top:18px}.small{color:#667c94;font-size:14px}.answer{text-align:center;padding:20px;font-size:21px;font-weight:750;color:#176338}.center{text-align:center}footer{text-align:center;margin-top:18px}button:focus-visible{outline:3px solid #f4ae31;outline-offset:3px}
</style></head><body><main><div class="card"><div class="top"><span id="counter"></span><span class="pill" id="status"></span></div><div class="question"><div class="paw">🐾</div><h1 id="question"></h1></div><section id="content"></section><div class="nav"><button class="secondary" id="prev">‹ Previous</button><button class="secondary" id="next">Next mystery ›</button></div><button class="ghost wide" id="random">⇄ Random mystery</button></div><footer class="small">Made for little clue hunters 🐾</footer></main><script>
const games=[
["What does Blue want to eat?","A peanut butter and jelly sandwich",["Bread","Peanut butter jar","Jelly jar"],"All three make something yummy!"],
["What does Blue want to play?","Cars!",["Toy car","A wheel","A toy road or ramp"],"What goes vroom?"],
["Where does Blue want to go?","The playground",["Shoes","A ball","A toy slide or playground picture"],"Where can we run and play?"],
["What animal is Blue thinking of?","A dinosaur",["Toy dinosaur","A big footprint drawn on paper","A toy egg"],"What animal lived long ago?"],
["What does Blue want to do?","Take a bath",["Rubber duck","Soap","Towel"],"Where do we use these?"],
["What does Blue want to build?","A tower",["LEGO brick","Wooden block","Picture of something tall"],"What can we stack?"],
["What does Blue want to wear?","A superhero costume",["Cape or blanket","Mask or sunglasses","Superhero action figure"],"Who wears a cape?"],
["What does Blue want for a snack?","An apple",["Something red","A toy tree","A fruit bowl"],"What red fruit grows on a tree?"],
["Where does Blue want to sleep?","A bed",["Pillow","Blanket","Stuffed animal"],"Where do these belong?"],
["What does Blue want to make?","A drawing",["Crayon","Paper","Coloring book"],"What can we create?"],
["What does Blue want to do outside?","Blow bubbles",["Bubble wand","Bubble solution","Picture of a circle"],"What floats in the air?"],
["What does Blue want to pretend to be?","A firefighter",["Toy fire truck","Something red","Toy helmet or hat"],"Who puts out fires?"]
];let index=0,hiding=true,found=new Set(),revealed=false;
const el=id=>document.getElementById(id);
function button(text,fn,cls="wide"){let b=document.createElement("button");b.textContent=text;b.className=cls;b.onclick=fn;return b}
function p(text,cls=""){let n=document.createElement("p");n.className=cls;n.textContent=text;return n}
function reset(i){index=(i+games.length)%games.length;hiding=true;found=new Set();revealed=false;render()}
function render(){let [q,a,clues,hint]=games[index],c=el("content");c.replaceChildren();el("counter").textContent="MYSTERY "+(index+1)+" OF "+games.length;el("status").textContent=hiding?"Parent setup":"Let's play!";el("status").className="pill"+(hiding?"":" play");el("question").textContent=q;
if(hiding){c.append(p("Hide a blue paw print on each of these objects:"));clues.forEach(t=>{let d=document.createElement("div");d.className="clue";let s=document.createElement("span");s.className="paw";s.textContent="🐾";d.append(s,document.createTextNode(t));c.append(d)});c.append(p("Secret answer (for the parent):","small"),p(a));c.append(button("✓ Done hiding — start playing!",()=>{hiding=false;render()}))}
else{c.append(p("Find all three of Blue's Clues!","center"));let grid=document.createElement("div");grid.className="clues";clues.forEach((t,i)=>{let b=button("",()=>{found.has(i)?found.delete(i):found.add(i);render()},"tile"+(found.has(i)?" found":""));let s=document.createElement("span");s.className="paw";s.textContent=found.has(i)?"✓":"🐾";b.append(s,document.createTextNode(found.has(i)?t:"Clue "+(i+1)));b.setAttribute("aria-pressed",found.has(i));grid.append(b)});c.append(grid);if(found.size===3){c.append(p(hint,"center small"));if(revealed)c.append(p("🎉 "+a+" — We figured out Blue's Clues!","answer"));c.append(button(revealed?"Hide answer":"Reveal answer!",()=>{revealed=!revealed;render()}))}c.append(button("Back to parent setup",()=>{hiding=true;render()},"wide secondary"))}el("prev").disabled=index===0}
el("prev").onclick=()=>reset(index-1);el("next").onclick=()=>reset(index+1);el("random").onclick=()=>reset((index+1+Math.floor(Math.random()*(games.length-1)))%games.length);render();
if("serviceWorker" in navigator)window.addEventListener("load",()=>navigator.serviceWorker.register("./sw.js").catch(()=>{}));
</script></body></html>
